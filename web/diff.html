<!DOCTYPE html>
<html>
<head>
  <title>OVCS - Diff Viewer</title>
  <link rel="stylesheet" href=
    "/node_modules/diff2html/bundles/css/diff2html.min.css">
  <link rel="stylesheet" href="diff-base.css">
  <link rel="stylesheet" href="diff-cards.css">
  <link rel="stylesheet" href="diff-search.css">
</head>
<body>
  <nav>
    <span class="brand">OVCS</span>
    <a href="/">Dashboard</a>
    <a href="/diff.html" class="active">
      Diff Viewer</a>
    <a href="/file.html">File Viewer</a>
    <a href="/data">Data (JSON)</a>
    <a href="/presence">Presence (JSON)</a>
    <a href="/sync-status">
      Sync Status (JSON)</a>
    <div class="nav-search">
      <input type="text" id="nav-search-input"
        placeholder="Search code..."
        onkeydown=
          "if(event.key==='Enter')navSearch()">
      <select id="nav-search-type">
        <option value="code">Code</option>
        <option value="ast">AST</option>
      </select>
      <button onclick="navSearch()">
        Search</button>
    </div>
  </nav>
  <div id="search-results"
    class="search-results-panel"
    style="display:none"></div>
  <div class="container">
    <h1>Diff Viewer</h1>
    <div id="summary" class="summary-bar"></div>
    <div class="orientation-bar">
      <span>Local on:</span>
      <button class="orient-btn"
        id="orient-left"
        onclick="setOrientation('left')">
        Left</button>
      <button class="orient-btn active"
        id="orient-right"
        onclick="setOrientation('right')">
        Right</button>
    </div>
    <div id="pagination-top"
      class="pagination"></div>
    <div id="content">
      <div class="loading">Loading...</div>
    </div>
    <div id="pagination-bottom"
      class="pagination"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "diff": "/node_modules/diff/libesm/index.js",
      "diff2html": "/node_modules/diff2html/lib-esm/diff2html.js"
    }
  }
  </script>
  <script type="module" src="diff-app.js">
  </script>
</body>
</html>
